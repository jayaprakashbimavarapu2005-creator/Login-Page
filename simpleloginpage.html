<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <style>
        body{
            background-color: aquamarine;
            font-family: 'Courier New', Courier, monospace;
        }
        .login{
            margin: 100px auto;
            padding: 25px;
            justify-content: center;
            background-color: aqua;
            width:300px ;
            border-radius: 20px;
            padding-left: 120px;
            border:3px solid black;
        }
        .login:hover{
            background-color: yellowgreen;
        }
        .login button{
            color: red;
            border: 1px solid black;
            border-radius: 5px;
            cursor: pointer;
            margin: 20px auto;
            margin-left: 50px;   
        }
        button:hover{
            background-color: red;
            color: black;
        }
        .login label{
            color: black;
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        font-size: small;
        }
        .login input:hover{
            background-color: rgb(177, 177, 171);
            color: black;
        }
        .login h1{
            color: red;
        }
    </style>
</head>
<body>
<div class="login">
    <h1>Login Page</h1>
    <label>Enter the user name</label><br>
    <input type="text" placeholder="enter the user name"><br>
    <label>Enter the password</label><br>
    <input type="password" placeholder="enter the password"><br>
    <div class="button">
        <button type="button">login</button>
    </div>
</div>
</body>
</html>
